<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b70">
<meta name="description" content="Calculadora comercial ADT de RC Red de Servicios">
<title>Calculadora ADT | RC Red de Servicios</title>

<style>
:root{
  --navy:#102b4e;
  --blue:#155da8;
  --blue2:#2479c8;
  --sky:#eaf4ff;
  --bg:#f3f6fb;
  --ink:#182b42;
  --muted:#6a7b90;
  --line:#dce5ef;
  --green:#15804a;
  --red:#b42318;
  --shadow:0 12px 34px #102b4e12
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif
}

button,select,input{font:inherit}

main{
  max-width:1050px;
  margin:auto;
  padding:24px 18px 42px
}

.hero{
  background:linear-gradient(125deg,#0c2340,#123f76 60%,#2079ba);
  color:#fff;
  border-radius:24px;
  padding:26px 28px;
  margin-bottom:20px;
  box-shadow:0 18px 44px #102b4e20
}

.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.brand{
  display:flex;
  align-items:center;
  gap:14px
}

/* LOGO RC: fondo transparente */
.brand-logo{
  width:88px;
  height:66px;
  object-fit:contain;
  background:transparent;
  border-radius:0;
  padding:0;
  flex:0 0 auto
}

.brand-text{
  font-size:12px;
  letter-spacing:1.5px;
  font-weight:800;
  color:#e1efff
}

.brand-text small{
  display:block;
  margin-top:5px;
  font-size:12px;
  letter-spacing:0;
  font-weight:500;
  color:#c5dcf4
}

.pill{
  border:1px solid #ffffff35;
  background:#ffffff12;
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  white-space:nowrap
}

h1{
  font-size:clamp(26px,4vw,37px);
  line-height:1.12;
  letter-spacing:-.8px;
  margin:24px 0 8px
}

.hero p{
  margin:0;
  max-width:680px;
  color:#d7e7f8;
  font-size:14px;
  line-height:1.6
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 335px;
  gap:18px;
  align-items:start
}

.panel,.summary-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  box-shadow:var(--shadow)
}

.panel{
  padding:22px;
  margin-bottom:16px
}

.section-head{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-bottom:18px
}

.step{
  width:36px;
  height:36px;
  flex:0 0 36px;
  display:grid;
  place-items:center;
  background:var(--sky);
  color:var(--blue);
  border-radius:12px;
  font-size:13px;
  font-weight:850
}

h2{
  font-size:18px;
  margin:1px 0 5px;
  letter-spacing:-.3px
}

.desc{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:0
}

.field-label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin:0 0 8px;
  color:#263b54
}

select{
  width:100%;
  min-height:47px;
  padding:11px 13px;
  border:1px solid #cfd9e5;
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  font-size:14px;
  margin-bottom:17px;
  outline:none
}

select:focus,input:focus{
  border-color:var(--blue2);
  box-shadow:0 0 0 3px #2479c81c
}

.choices{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin:9px 0 19px
}

.choice{
  min-height:70px;
  padding:13px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  color:var(--ink);
  cursor:pointer
}

.choice strong{
  display:block;
  margin-bottom:5px;
  font-size:14px
}

.choice span{
  display:block;
  color:var(--muted);
  font-size:12px
}

.choice.selected{
  border:1.5px solid var(--blue2);
  background:var(--sky)
}

.choice.selected strong{color:var(--blue)}

.price-hint{
  border:1px solid #e0eaf4;
  background:#f5f9fd;
  border-radius:12px;
  padding:13px;
  font-size:13px;
  color:var(--muted);
  line-height:1.5
}

.good{color:var(--green);font-weight:800}
.bad{color:var(--red);font-weight:800}

.extra-list{
  display:grid;
  gap:9px
}

.extra{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px
}

.extra-info{
  flex:1;
  min-width:0
}

.extra-info strong{
  display:block;
  font-size:13px;
  line-height:1.35
}

.extra-info small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px
}

.qty{
  display:flex;
  align-items:center;
  gap:5px
}

.qty button{
  width:30px;
  height:31px;
  border:1px solid #d6e0eb;
  border-radius:8px;
  background:#f8fafc;
  color:var(--blue);
  font-weight:900;
  cursor:pointer
}

.qty button:disabled{
  opacity:.35;
  cursor:not-allowed
}

.qty input{
  width:38px;
  height:32px;
  text-align:center;
  border:1px solid #cfd9e5;
  border-radius:8px;
  font-weight:800;
  font-size:14px;
  padding:2px
}

.ext-total{
  min-width:74px;
  text-align:right;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  font-size:13px;
  font-weight:800;
  cursor:pointer
}

.btn-primary{
  background:var(--blue);
  color:white
}

.btn-secondary{
  background:#edf2f8;
  color:#33485f
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px
}

.summary-card{
  position:sticky;
  top:16px;
  overflow:hidden
}

.summary-top{
  padding:20px;
  background:linear-gradient(135deg,#102b4e,#155da8);
  color:white
}

.summary-top small{
  display:block;
  color:#c8def4;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  font-weight:800;
  margin-bottom:7px
}

.summary-top h2{
  font-size:19px;
  margin:0
}

.summary-body{padding:18px}

.placeholder{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:0
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #edf1f6;
  font-size:12px
}

.row span{
  color:var(--muted);
  line-height:1.45
}

.row strong{
  text-align:right;
  overflow-wrap:anywhere;
  line-height:1.45
}

.minor-title{
  margin:16px 0 3px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:850;
  color:var(--muted)
}

.total-box{
  padding:15px;
  margin-top:15px;
  background:#f0f7ff;
  border:1px solid #d9eaff;
  border-radius:13px
}

.total-caption{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--blue);
  font-size:11px;
  font-weight:850;
  letter-spacing:.5px
}

.total-value{
  font-size:28px;
  font-weight:900;
  letter-spacing:-.6px;
  color:var(--navy);
  margin-top:7px;
  overflow-wrap:anywhere
}

.total-note,.note{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
  margin-top:7px
}

.note{margin-top:13px}

.warning{
  margin-top:11px;
  padding:11px;
  background:#fff7e8;
  border:1px solid #f7e3bb;
  border-radius:10px;
  color:#79551c;
  font-size:11px;
  line-height:1.5
}

.summary-actions{
  display:grid;
  gap:8px;
  margin-top:15px
}

.summary-actions button{width:100%}

footer{
  text-align:center;
  color:#8290a1;
  font-size:11px;
  padding:18px 0 0
}

@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .summary-card{position:static;order:2}
  .hero{padding:21px}
  .panel{padding:18px}
  .brand-logo{width:74px;height:58px}
  .pill{display:none}
}

@media(max-width:440px){
  main{padding:10px 9px 28px}
  .choices{grid-template-columns:1fr}
  .choice{min-height:62px}
  .extra{gap:7px;padding:10px 8px}
  .qty{gap:3px}
  .qty button{width:27px;height:29px}
  .qty input{width:33px}
  .ext-total{min-width:61px;font-size:10px}
  .brand-text{
