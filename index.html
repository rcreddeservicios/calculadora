<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b70">
<meta name="description" content="Calculadora comercial de kits ADT de RC Red de Servicios.">
<title>Calculadora ADT | RC Red de Servicios</title>

<style>
:root{
  --navy:#102b4e;
  --blue:#155da8;
  --blue2:#2479c8;
  --sky:#eaf4ff;
  --orange:#f28c28;
  --bg:#f3f6fb;
  --paper:#fff;
  --ink:#182b42;
  --muted:#6a7b90;
  --line:#dce5ef;
  --green:#15804a;
  --red:#b42318;
  --shadow:0 12px 34px rgba(16,43,78,.07)
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,select,input{font:inherit}

main{
  max-width:1050px;
  margin:0 auto;
  padding:24px 18px 48px
}

.hero{
  position:relative;
  overflow:hidden;
  color:white;
  background:linear-gradient(125deg,#0c2340 0%,#123f76 55%,#2079ba 100%);
  border-radius:26px;
  padding:28px 30px;
  margin-bottom:20px;
  box-shadow:0 18px 44px #102b4e20
}

.hero:after{
  content:"";
  position:absolute;
  width:330px;
  height:330px;
  border:1px solid #ffffff16;
  border-radius:50%;
  right:-90px;
  top:-160px;
  box-shadow:0 0 0 32px #ffffff08,0 0 0 66px #ffffff06;
  pointer-events:none
}

.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  position:relative;
  z-index:1
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0
}

.brand-logo{
  width:94px;
  height:72px;
  object-fit:contain;
  background:#fff;
  border-radius:14px;
  padding:6px;
  flex:0 0 auto
}

.brand-text{
  font-size:12px;
  letter-spacing:1.7px;
  font-weight:800;
  color:#d9eaff
}

.brand-text small{
  display:block;
  font-size:12px;
  letter-spacing:0;
  font-weight:500;
  color:#c0d8ef;
  margin-top:5px
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border:1px solid #ffffff35;
  background:#ffffff10;
  border-radius:999px;
  font-size:12px;
  color:#e9f4ff;
  white-space:nowrap
}

.pill:before{
  content:"";
  width:7px;
  height:7px;
  background:#6ee7a1;
  border-radius:50%;
  box-shadow:0 0 0 4px #6ee7a122
}

h1{
  font-size:clamp(26px,4vw,37px);
  line-height:1.12;
  letter-spacing:-1px;
  margin:25px 0 9px;
  position:relative;
  z-index:1
}

.hero p{
  max-width:660px;
  color:#d7e7f8;
  font-size:15px;
  line-height:1.6;
  margin:0;
  position:relative;
  z-index:1
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:20px;
  align-items:start
}

.maincol{min-width:0}

.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:20px;
  padding:23px;
  margin-bottom:16px;
  box-shadow:var(--shadow)
}

.section-head{
  display:flex;
  align-items:flex-start;
  gap:13px;
  margin-bottom:18px
}

.step{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  flex:0 0 36px;
  background:var(--sky);
  color:var(--blue);
  border-radius:12px;
  font-weight:800;
  font-size:14px
}

h2{
  margin:1px 0 5px;
  font-size:18px;
  letter-spacing:-.3px
}

.desc{
  font-size:13px;
  line-height:1.55;
  color:var(--muted);
  margin:0
}

label.field-label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin-bottom:8px;
  color:#263b54
}

select{
  width:100%;
  min-height:48px;
  padding:12px 42px 12px 13px;
  border:1px solid #cfd9e5;
  border-radius:12px;
  background-color:#fff;
  color:var(--ink);
  font-size:14px;
  outline:none;
  margin-bottom:17px
}

select:focus,input:focus{
  border-color:var(--blue2);
  box-shadow:0 0 0 3px #2479c81c
}

.choices{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin:9px 0 20px
}

.choice{
  width:100%;
  min-height:76px;
  padding:14px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--ink);
  cursor:pointer;
  transition:border-color .15s,background .15s,transform .15s
}

.choice:hover{
  border-color:#9dbfe1;
  transform:translateY(-1px)
}

.choice strong{
  display:block;
  margin-bottom:5px;
  font-size:14px
}

.choice span{
  display:block;
  color:var(--muted);
  font-size:12px;
  line-height:1.4
}

.choice.selected{
  border:1.5px solid var(--blue2);
  background:var(--sky);
  box-shadow:inset 0 0 0 1px #2479c81c
}

.choice.selected strong{color:var(--blue)}

.price-hint{
  background:#f5f9fd;
  border:1px solid #e0eaf4;
  border-radius:12px;
  padding:13px 14px;
  font-size:13px;
  line-height:1.5;
  color:var(--muted)
}

.good{color:var(--green);font-weight:800}
.bad{color:var(--red);font-weight:750}

.extra-list{
  display:grid;
  gap:10px
}

  align-items:center;
  gap:12px;
